<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
            <!-- Pembungkus Luar: Membuat posisi berada di tengah layar -->
        <div class="d-flex justify-content-center align-items-center vh-100">

            <!-- Pembungkus Card/Form: Membatasi lebar form -->
            <div class="card p-4 shadow" style="width: 100%; max-width: 400px;">
                
                <form>
                <!-- Input Full Name -->
                <div class="mb-3">
                    <label for="email" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="email" placeholder="Input Full Name">
                </div>

                <!-- Input Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com">
                </div>

                <!-- Input Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="*******">
                </div>

                <!-- Tombol Login -->
                 <div class="d-flex gap-2">
                     <a href="index.html" class="btn btn-primary text-decoration-none w-100 text-center ">Kemabli</a>
                 </div>

                </form>

            </div>

        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
